name: Build and Push to DockerHub

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # php-7.4 基础镜像（含 CVE-2026-109618/109619 官方安全补丁重编译）
  build-and-push-php-74:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 设置 Docker Buildx，启用高级缓存支持能力
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push php-7.4
        uses: docker/build-push-action@v7
        with:
          context: ./php/7.4
          file: ./php/7.4/Dockerfile # 显式指定 Dockerfile 的位置
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-php:7.4
          # 开启 GitHub Actions 的自带缓存，让后续的构建速度飞起来
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # php-8.5 基础镜像（官方版本自身不受 CVE-2026-109618/109619 影响）
  build-and-push-php-85:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push php-8.5
        uses: docker/build-push-action@v7
        with:
          context: ./php/8.5
          file: ./php/8.5/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-php:8.5
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # alpine CI 部署镜像（openssh-client + rsync + git + bash → 独立 hub 仓库）
  build-and-push-alpine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push alpine
        uses: docker/build-push-action@v7
        with:
          context: ./alpine/3.24
          file: ./alpine/3.24/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-alpine:3.24
          cache-from: type=gha
          cache-to: type=gha,mode=max
