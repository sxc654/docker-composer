name: Build and Push to DockerHub

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # php-7.4 基础镜像（含 CVE-2026-109618/109619 官方安全补丁重编译）
  build-and-push-php-74:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 Docker Buildx，启用高级缓存支持能力
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push php-7.4
        uses: docker/build-push-action@v6
        with:
          context: ./basic/php-7.4
          file: ./basic/php-7.4/Dockerfile # 显式指定 Dockerfile 的位置
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-php:7.4
          # 开启 GitHub Actions 的自带缓存，让后续的构建速度飞起来
          cache-from: type=gha
          cache-to: type=gha,mode=max
