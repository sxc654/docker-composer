name: Build and Push to DockerHub

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 18
          - version: 22
          - version: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 设置 Docker Buildx，启用高级缓存支持能力
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push node-${{ matrix.version }}
        uses: docker/build-push-action@v7
        with:
          context: ./node-${{ matrix.version }}
          file: ./node-${{ matrix.version }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-node:${{ matrix.version }}
          # 开启 GitHub Actions 的自带缓存，让后续的构建速度飞起来
          cache-from: type=gha
          cache-to: type=gha,mode=max
